services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${LARAVEL_APP_KEY}
      APP_URL: ${PUBLIC_APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET}
      LEAD_PROXY_SECRET: ${LEAD_PROXY_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    restart: unless-stopped
    environment:
      APP_URL: ${PUBLIC_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"

  frontend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
