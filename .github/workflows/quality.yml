name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, Next.js and Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, tokenizer, xml, xmlwriter, zip

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'

      - name: Set up pnpm 11.9.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.9.0

      - name: Install PHP dependencies from lockfile
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node.js dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1

      # Line coverage is measured only in CI (local PHP has no pcov/xdebug). This
      # step reports the % and writes clover XML; it does not yet hard-fail on a
      # threshold — raise a minimum here once the baseline number is confirmed.
      - name: Backend line coverage (pcov)
        working-directory: backend
        run: php vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      # Prints the exact uncovered statement lines per file so real gaps can be
      # targeted precisely (local PHP has no coverage driver to produce this).
      - name: List uncovered statement lines
        if: always()
        working-directory: backend
        run: |
          php -r '$x=@simplexml_load_file("coverage.xml"); if(!$x){echo "no coverage.xml\n";exit;} $cwd=getcwd()."/"; foreach($x->project->file as $f){$n=str_replace($cwd,"",(string)$f["name"]); $u=[]; foreach($f->line as $l){ if((string)$l["type"]==="stmt" && (int)$l["count"]===0){$u[]=(int)$l["num"];} } if($u){echo $n.": ".implode(",",$u)."\n";} }'
