name: Quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, Next.js and Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, tokenizer, xml, xmlwriter, zip

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14.1'

      - name: Set up pnpm 11.9.0
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.9.0

      - name: Install PHP dependencies from lockfile
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node.js dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality-gate.ps1

      - name: Validate production deployment contour and preflight
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          LARAVEL_APP_KEY: base64:ci-only-key-not-for-production
          NEXT_REVALIDATE_SECRET: ci-only-revalidate-secret-with-32-characters
          LEAD_PROXY_SECRET: ci-only-lead-proxy-secret-with-32-characters
          DEFAULT_SITE_HOST: microchips.by
          PUBLIC_APP_URL: https://microchips.by
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.production.yml config --quiet
          sh scripts/release-preflight.sh
          if PUBLIC_APP_URL=https://wrong.invalid sh scripts/release-preflight.sh; then
            echo "Expected mismatched public host to fail preflight" >&2
            exit 1
          fi
          pwsh -File ./scripts/verify-public-release.ps1 -RunSelfTest

      # Line coverage is measured only in CI (local PHP has no pcov/xdebug). This
      # step reports the % and writes clover XML.
      - name: Backend line coverage (pcov)
        working-directory: backend
        run: php vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      # Hard floor: fail the build if backend line coverage regresses below 95%.
      # Baseline at introduction was 98.30% (1390/1414), so this leaves headroom
      # for defensive/relation lines that are deliberately not covered while still
      # catching a real drop. Raise the floor as coverage climbs.
      - name: Enforce backend coverage floor (>=95% lines)
        working-directory: backend
        run: |
          php -r '$floor=95.0; $x=@simplexml_load_file("coverage.xml"); if(!$x){fwrite(STDERR,"no coverage.xml\n");exit(1);} $m=$x->project->metrics; $s=(int)$m["statements"]; $c=(int)$m["coveredstatements"]; $p=$s? $c/$s*100:0; printf("Backend line coverage: %.2f%% (%d/%d), floor %.1f%%\n",$p,$c,$s,$floor); if($p+1e-9 < $floor){fwrite(STDERR,sprintf("FAIL: coverage %.2f%% is below floor %.1f%%\n",$p,$floor)); exit(1);} echo "OK: coverage floor satisfied\n";'

      # Prints the exact uncovered statement lines per file so real gaps can be
      # targeted precisely (local PHP has no coverage driver to produce this).
      - name: List uncovered statement lines
        if: always()
        working-directory: backend
        run: |
          php -r '$x=@simplexml_load_file("coverage.xml"); if(!$x){echo "no coverage.xml\n";exit;} $cwd=getcwd()."/"; foreach($x->xpath("//file") as $f){$n=str_replace($cwd,"",(string)$f["name"]); $u=[]; foreach($f->line as $l){ if((string)$l["type"]==="stmt" && (int)$l["count"]===0){$u[]=(int)$l["num"];} } if($u){echo $n.": ".implode(",",$u)."\n";} }'

  docker-smoke:
    name: Docker build, migrate and HTTP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Generate an ephemeral Laravel key
        run: echo "LARAVEL_APP_KEY=base64:$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Build and start the complete stack
        run: docker compose --env-file .env.example up --build --wait -d

      - name: Apply PostgreSQL migrations
        run: docker compose --env-file .env.example exec -T backend php artisan migrate --force

      - name: Verify PostgreSQL backup and isolated restore
        run: docker compose --env-file .env.example exec -T postgres sh -s < scripts/verify-postgres-backup.sh

      - name: Verify backend and frontend over HTTP
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/admin/login > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/robots.txt > /dev/null

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.example ps
          docker compose --env-file .env.example logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
